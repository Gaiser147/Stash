name: Navidrome Debug APK

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: navidrome-debug-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-debug:
    name: Merge upstream and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Navidrome branch
        uses: actions/checkout@v4
        with:
          ref: codex/navidrome-auto-sync
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/rawnaldclark/Stash.git
          git fetch upstream master --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream master
        run: |
          if ! git merge --no-edit upstream/master; then
            echo "::error::Merge conflict while merging upstream/master into codex/navidrome-auto-sync"
            git status --short
            echo "Unmerged files:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Assemble debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Push updated Navidrome branch
        run: |
          if git diff --quiet origin/codex/navidrome-auto-sync..HEAD; then
            echo "No upstream changes to push."
          else
            git push origin HEAD:codex/navidrome-auto-sync
          fi

      - name: Locate debug APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced by assembleDebug"
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          RELEASE_NAME="Stash-navidrome-debug-$SHORT_SHA.apk"
          cp "$APK" "$RUNNER_TEMP/$RELEASE_NAME"
          echo "apk_path=$RUNNER_TEMP/$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=navidrome-debug-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_apk.outputs.tag }}
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Check release tag
        id: release_tag
        run: |
          TAG="${{ steps.find_apk.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish debug release
        if: steps.release_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.find_apk.outputs.tag }}
          name: Navidrome Debug ${{ steps.find_apk.outputs.short_sha }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.find_apk.outputs.apk_path }}
          body: |
            Automated debug APK for the Navidrome auto-sync branch.

            This workflow checks out `codex/navidrome-auto-sync`, merges `rawnaldclark/Stash` `master`, builds `:app:assembleDebug`, and publishes a prerelease only once per resulting commit.
